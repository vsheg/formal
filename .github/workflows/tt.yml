name: TT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tt:
    name: Run tt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.19.1

      - name: Install tytanic
        run: cargo binstall --no-confirm --disable-strategies compile tytanic@0.3.3

      - name: Run tt tests
        run: tt run --no-fail-fast

      - name: Upload tt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tt-artifacts
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          if-no-files-found: ignore
          retention-days: 5
